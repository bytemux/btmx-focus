# PR title = Conventional Commits (btmx-sdlc docs/conventions.md §3).
# With squash merge the PR title becomes the commit on main, and the Release
# workflow reads the version bump from it (docs/versioning.md).
# Blocks merge only when the ruleset on main requires the "pr-title" check.
# Keep the types in sync with scripts/next-version.sh.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          # Through env, never ${{ }} in the script: a title can hold shell code.
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|refactor|perf|test|docs|style|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error::PR title needs a type, e.g. 'feat: …', 'fix(ui): …', 'chore!: …'. Got: $TITLE"
          echo "Types: feat (minor); fix, perf, refactor, revert (patch);"
          echo "docs, chore, ci, test, style, build (no release). '!' after the type: major."
          exit 1
