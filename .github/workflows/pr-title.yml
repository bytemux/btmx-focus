# PR title check (ADR 0018). The PR title becomes the merge commit's title,
# and the Release workflow decides the version and changelog from it, so it
# must start with a Conventional Commits type:
#   type(optional scope)!: summary
# Make this check required on main (Settings → Rules) so a PR can't merge
# without it. Keep the types in sync with release.yml.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-type:
    name: Conventional type
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          # Through env, never ${{ }} in the script: a title can hold shell code.
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|perf|refactor|revert|docs|chore|ci|test|style|build)(\([a-z0-9-]+\))?!?: [^ ].*'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error::PR title needs a type, e.g. 'feat: …', 'fix(timer): …', 'chore!: …'. Got: $TITLE"
          echo "Types: feat, fix (minor release); perf, refactor, revert (patch);"
          echo "docs, chore, ci, test, style, build (no release). '!' after the type: major."
          exit 1
