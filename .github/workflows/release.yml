# Release (ADR 0016, 0017): runs on every push to main (a merged PR), or by
# hand from Actions → Release → Run workflow.
# scripts/next-version.sh (from btmx-sdlc) computes the SemVer version from
# the commits on main since the latest v* tag (ADR 0018, 0019):
#   breaking (`type!:` or BREAKING CHANGE) → major, feat → minor,
#   fix/perf/refactor/revert → patch. Other types (docs, chore, ci, test,
#   style, build) and titles with no type don't count; with nothing else
#   since the tag the run ends green without releasing.
# No tag yet → 0.0.1. The macOS runner only starts once the plan job has a
# version.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only compute and print the version; build nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default; only the release job can write (btmx-sdlc docs/ci.md §3).
permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      changelog: ${{ steps.next.outputs.changelog }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false # do not save the token in .git/config
      - id: next
        run: scripts/next-version.sh # from btmx-sdlc; rules: ADR 0019

  release:
    needs: plan
    # No version: nothing to release. dry_run is only set by hand.
    if: ${{ needs.plan.outputs.version != '' && !inputs.dry_run }}
    runs-on: macos-26
    # Replaces the workflow-level block for this job: gh release create needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gh reads GH_TOKEN; release.sh's `git fetch` works without a
          # token because the repo is public.
          persist-credentials: false
      # bash 3.2 (macOS) exits 0 after a parse error when the script has an
      # EXIT trap, so the job would go green having done nothing; fail on
      # a parse error before anything runs.
      - name: Check the scripts parse
        run: |
          for script in scripts/*.sh; do /bin/bash -n "$script"; done
      - name: Build, publish and update the tap
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANGELOG: ${{ needs.plan.outputs.changelog }}
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: scripts/release.sh
      # Backstop: check the result instead of trusting release.sh's exit code.
      - name: Verify the release and the cask
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -qx "btmx-focus-$VERSION.dmg"
          GH_TOKEN="$TAP_TOKEN" gh api -H 'Accept: application/vnd.github.raw+json' \
            repos/bytemux/homebrew-tap/contents/Casks/btmx-focus.rb \
            | grep -q "^  version \"$VERSION\""
          echo "v$VERSION is published and the cask points at it"
          {
            echo "## Released v$VERSION"
            echo "[Release notes and DMG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION) · \`brew upgrade btmx-focus\`"
          } >>"$GITHUB_STEP_SUMMARY"
